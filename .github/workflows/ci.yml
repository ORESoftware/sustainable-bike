name: cad-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cad-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscad xvfb
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Test calculations, year deltas, and unsafe config mutations
        run: npm test
      - name: Confirm both generated CAD configs are committed
        run: npm run generate:check
      - name: Validate both configs and compile every yearly CAD target
        run: npm run validate
      - name: Emit year-over-year engineering comparison
        run: npm run compare | tee build/design-comparison.json
      - name: Render printable calibration coupons for both years
        env:
          FACET_COUNT: '24'
          PART_TIMEOUT_SECONDS: '180'
          RESUME: '0'
        run: npm run render:coupons
      - name: Render both yearly previews
        run: npm run render:preview
      - uses: actions/upload-artifact@v4
        with:
          name: sustainable-bike-2026-2027-verification
          path: |
            assets/preview-2026.png
            assets/preview-2027.png
            build/design-comparison.json
            build/stl/2026/frame_coupon.stl
            build/stl/2026/tire_coupon.stl
            build/stl/2027/frame_coupon.stl
            build/stl/2027/tire_coupon.stl
            build/logs/**/*.log
          if-no-files-found: error
