name: cad-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cad-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openscad xvfb
      - name: Unit tests
        run: npm test
      - name: Validate config and compile every CAD target
        run: npm run validate
      - name: Render preview
        run: npm run render:preview
      - uses: actions/upload-artifact@v4
        with:
          name: sustainable-bike-preview
          path: assets/preview.png
          if-no-files-found: error
